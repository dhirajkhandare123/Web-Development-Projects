<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body {
        background-color: black;
        margin: 0;
    }

    .navbar {
        height: 70px;
        width: 100%;
        background-color: aqua;
        position: sticky;
        top: 0;
        z-index: 999;
    }

    .container {
        width: 100%;
    }

    /* Sidebar */
    .left {
        height: calc(100vh - 70px);
        width: 20%;
        background-color: purple;

        position: fixed;
        top: 70px;   /* navbar ke neeche fix */
        left: 0;
    }

    /* RIGHT CONTENT */
    .right {
        width: 80%;
        margin-left: 20%; /* sidebar ki jagah chhod di */
        
    }

    .box {
        height: calc(100vh - 70px);
        border: 4px solid rgb(221, 12, 127);
        margin: 10px auto;
    }

    .box1 { background-color: chartreuse; }
    .box2 { background-color: blueviolet; }
    .box3 { background-color: gray; }
    .box4 { background-color: rgb(235, 36, 1); }

    .footer{
        background-color: orangered;
        border: 4px solid black;
        /* width: 100%; */
        height: 100px;
        
    }
</style>
</head>

<body>
    <div class="navbar"></div>
    <div class="container">
        <div class="left">
            <div class="sidebar"></div>
        </div>
        <div class="right">
            <div class="box box1"></div>
            <div class="box box2"></div>
            <div class="box box3"></div>
            <div class="box box4"></div>
            <div class="footer"></div>
        </div>

    </div>
</body>

</html>
